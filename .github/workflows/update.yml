name: Actualizar JSON de Radares Europa

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 03:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  update-radares:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Ejecutar script de extracción de radares
      run: python generar_radares.py

    - name: Guardar y hacer push de radares.json si hay cambios
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add radares.json
        git commit -m "auto: actualización automática de radares.json [skip ci]" || exit 0
        git push
