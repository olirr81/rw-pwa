<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avisador de Radares</title>
    <!-- CSS Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
        
        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; border: 1px solid #333; }
        .btn { width: 100%; padding: 16px; border-radius: 10px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn-active { background: #2e7d32; color: white; }
        .btn-inactive { background: #d32f2f; color: white; }
        
        .stat-label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; text-align: center; margin: 4px 0; color: #4fc3f7; }
        .stat-sub { font-size: 0.8rem; color: #666; text-align: center; }
        
        .radar-card { border-left: 6px solid #f44336; }
        .radar-dist { font-size: 2.2rem; font-weight: bold; text-align: center; color: #f44336; }

        /* Estilo del Mapa */
        #map { height: 260px; width: 100%; border-radius: 10px; border: 1px solid #444; }
        
        #logs { background: #000; color: #00ff66; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 8px; height: 120px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>Avisador de Radares</h1>

    <!-- Botón de Control -->
    <button id="toggleBtn" class="btn btn-inactive">Iniciar Avisador</button>

    <!-- Indicador de Pantalla Siempre Encendida -->
    <div style="text-align: center; font-size: 0.75rem; color: #888;">
        Pantalla: <span id="wakeLockStatus" style="color: #ff9800;">Inactiva</span>
    </div>

    <!-- Panel Velocidad -->
    <div class="card">
        <div class="stat-label">Velocidad actual</div>
        <div class="stat-value" id="speedDisplay">0 km/h</div>
        <div class="stat-sub" id="coordsDisplay">Lat: --, Lon: --</div>
    </div>

    <!-- Panel Radar Cercano -->
    <div class="card radar-card">
        <div class="stat-label">Radar más cercano (en tu rumbo)</div>
        <div class="stat-value" id="radarType" style="color: #fff; font-size: 1.2rem;">--</div>
        <div class="radar-dist" id="radarDist">-- m</div>
    </div>

    <!-- Mapa Interactivo -->
    <div class="card" style="padding: 8px;">
        <div id="map"></div>
    </div>

    <!-- Logs -->
    <div class="card">
        <div class="stat-label" style="text-align: left; margin-bottom: 6px;">Logs del sistema:</div>
        <div id="logs">Iniciando aplicación...\n</div>
    </div>

    <!-- Script de Leaflet (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let isRunning = false;
        let watchId = null;
        let radares = [];
        let wakeLock = null;
        let lastPosition = null;
        let currentHeading = null;

        // Variables del Mapa
        let map, userMarker;
        let radarMarkersGroup;

        const toggleBtn = document.getElementById('toggleBtn');
        const speedDisplay = document.getElementById('speedDisplay');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const radarType = document.getElementById('radarType');
        const radarDist = document.getElementById('radarDist');
        const wakeLockStatus = document.getElementById('wakeLockStatus');

        function log(msg) {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logs.innerHTML += `[${time}] ${msg}\n`;
            logs.scrollTop = logs.scrollHeight;
        }

        // --- 1. Inicializar Mapa ---
        function initMap() {
            // Inicializar centrado en coordenadas por defecto (Barcelona)
            map = L.map('map').setView([41.3851, 2.1734], 13);
            
            // Usar capas de CartoDB Dark Matter (tema oscuro perfecto para conducción)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            radarMarkersGroup = L.layerGroup().addTo(map);
        }

        // --- 2. Cargar Radares ---
        async function loadRadares() {
            try {
                log("Intentando descargar radares.json...");
                const res = await fetch('radares.json');
                radares = await res.json();
                log(`¡ÉXITO! Cargados ${radares.length} radares en memoria.`);
                renderRadarMarkers();
            } catch (e) {
                log("⚠️ Error cargando radares.json");
            }
        }

        function renderRadarMarkers() {
            if (!map || !radares.length) return;
            radarMarkersGroup.clearLayers();
            
            // Dibujar radares en el mapa como círculos rojos
            radares.forEach(r => {
                L.circleMarker([r.lat, r.lon], {
                    color: '#f44336',
                    radius: 5,
                    fillOpacity: 0.8
                }).bindPopup(`<b>${r.tipo}</b><br>Límite: ${r.velocidad} km/h`).addTo(radarMarkersGroup);
            });
        }

        // --- 3. Wake Lock API (Evita pantalla negra) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockStatus.innerText = "ACTIVA (Pantalla encendida)";
                    wakeLockStatus.style.color = "#4caf50";
                    log("💡 Wake Lock activado: la pantalla no se apagará.");
                }
            } catch (err) {
                wakeLockStatus.innerText = "No soportado / Error";
                log(`⚠️ Wake Lock error: ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
                wakeLockStatus.innerText = "Inactiva";
                wakeLockStatus.style.color = "#ff9800";
            }
        }

        // --- 4. Cálculo de Distancias y Rumbo (Heading) ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metros
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            const brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        // --- 5. Lógica de Geolocalización ---
        function handlePosition(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const speedKmH = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            
            // Actualizar interfaz básica
            speedDisplay.innerText = `${speedKmH} km/h`;
            coordsDisplay.innerText = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;

            // Calcular rumbo actual del vehículo
            if (lastPosition) {
                const distMoved = getDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                if (distMoved > 3) { // solo calcular si nos desplazamos >3 metros
                    currentHeading = calculateBearing(lastPosition.lat, lastPosition.lon, lat, lon);
                }
            }
            lastPosition = { lat, lon };

            // Actualizar Mapa
            const currentPos = [lat, lon];
            if (!userMarker) {
                userMarker = L.marker(currentPos).addTo(map).bindPopup("¡Estás aquí!");
                map.setView(currentPos, 15);
            } else {
                userMarker.setLatLng(currentPos);
                map.panTo(currentPos);
            }

            // Buscar radar más cercano (filtrando por ángulo / sentido de marcha si hay rumbo)
            if (radares.length > 0) {
                let minDist = Infinity;
                let closestRadar = null;

                radares.forEach(r => {
                    const d = getDistance(lat, lon, r.lat, r.lon);
                    
                    // Si tenemos rumbo, comprobamos si el radar está por delante en un abanico de ±60°
                    let inDirection = true;
                    if (currentHeading !== null) {
                        const bearingToRadar = calculateBearing(lat, lon, r.lat, r.lon);
                        const diff = Math.abs(currentHeading - bearingToRadar);
                        const angle = diff > 180 ? 360 - diff : diff;
                        inDirection = angle <= 60; // solo radares enfrente
                    }

                    if (inDirection && d < minDist) {
                        minDist = d;
                        closestRadar = r;
                    }
                });

                if (closestRadar) {
                    radarType.innerText = `${closestRadar.tipo} (${closestRadar.velocidad} km/h)`;
                    radarDist.innerText = `${Math.round(minDist)} m`;

                    // Avisos sonoros según la cercanía
                    if (minDist < 500 && minDist > 450) {
                        playAudioAlert();
                    }
                }
            }
        }

        function playAudioAlert() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Tono A5
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }

        // --- Toggle Activar / Desactivar ---
        toggleBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                toggleBtn.innerText = "Avisador Activo";
                toggleBtn.className = "btn btn-active";
                requestWakeLock();
                
                log("Solicitando acceso a Geolocation API...");
                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    (err) => log(`⚠️ Error GPS: ${err.message}`),
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            } else {
                isRunning = false;
                toggleBtn.innerText = "Iniciar Avisador";
                toggleBtn.className = "btn btn-inactive";
                releaseWakeLock();
                if (watchId) navigator.geolocation.clearWatch(watchId);
                log("Avisador detenido.");
            }
        });

        // Inicializar al cargar
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadRadares();
        });
    </script>
</body>
</html>
