<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisador Radares</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; text-align: center; padding: 15px; margin: 0; }
    h1 { font-size: 22px; margin: 10px 0; }
    .card { background: #222; border-radius: 12px; padding: 12px; margin: 10px 0; border: 1px solid #333; }
    button { background: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    .radar { border-left: 5px solid #ef4444; }
    .big-num { font-size: 32px; font-weight: bold; color: #3b82f6; margin-top: 2px; }
    #debugConsole { background: #000; color: #00ff00; font-family: monospace; font-size: 11px; text-align: left; padding: 8px; border-radius: 8px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; margin-top: 15px; border: 1px solid #444; }
  </style>
</head>
<body>

  <h1>Avisador de Radares</h1>
  
  <div class="card">
    <button id="btnStart">1. Activar Avisador</button>
    <p id="status" style="font-size: 12px; color: #aaa; margin-top: 6px;">Estado: Inactivo</p>
  </div>

  <div class="card">
    <div>Velocidad actual</div>
    <div id="speed" class="big-num">0 km/h</div>
    <div id="coords" style="font-size: 11px; color: #888; margin-top: 4px;">GPS: Sin datos</div>
  </div>

  <div class="card radar">
    <div>Radar más cercano</div>
    <div id="radarInfo" style="margin-top: 5px; font-weight: bold;">Cargando BDD...</div>
    <div id="radarDist" style="color: #ef4444; font-size: 24px; font-weight: bold; margin-top: 5px;">-- m</div>
  </div>

  <!-- Panel de Debugging -->
  <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">Logs del sistema:</div>
  <div id="debugConsole">Iniciando aplicación...\n</div>

<script>
  let radaresBDD = [];
  let ultimoAviso = 0;

  function log(msg) {
    const consoleEl = document.getElementById('debugConsole');
    consoleEl.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function hablar(texto) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(texto);
      msg.lang = 'es-ES';
      window.speechSynthesis.speak(msg);
    }
  }

  function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return Math.round(R * c);
  }

  async function cargarRadares() {
    log("Intentando descargar radares.json...");
    try {
      const resp = await fetch('radares.json');
      if (!resp.ok) throw new Error(`HTTP Error: ${resp.status}`);
      radaresBDD = await resp.json();
      log(`¡ÉXITO! Cargados ${radaresBDD.length} radares en memoria.`);
      document.getElementById('radarInfo').innerText = `BDD Lista (${radaresBDD.length} radares)`;
    } catch (e) {
      log(`ERROR BDD: ${e.message}`);
      document.getElementById('radarInfo').innerText = "ERROR: No se halló radares.json";
    }
  }

  document.getElementById('btnStart').addEventListener('click', async () => {
    log("Botón presionado. Inicializando audio...");
    hablar("Avisador activado");
    
    await cargarRadares();
    
    document.getElementById('status').innerText = "Rastreando GPS...";
    document.getElementById('btnStart').style.background = "#16a34a";
    document.getElementById('btnStart').innerText = "Avisador Activo";

    if ("geolocation" in navigator) {
      log("Solicitando acceso a Geolocation API...");
      navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

        document.getElementById('speed').innerText = `${speed} km/h`;
        document.getElementById('coords').innerText = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;

        if (radaresBDD.length === 0) {
          log("AVISO GPS: Recibida posición, pero BDD radares está vacía.");
          return;
        }

        let radarCercano = null;
        let distMinima = Infinity;

        for (let i = 0; i < radaresBDD.length; i++) {
          const r = radaresBDD[i];
          const d = calcularDistancia(lat, lon, r.lat, r.lon);
          if (d < distMinima) {
            distMinima = d;
            radarCercano = r;
          }
        }

        if (radarCercano) {
          document.getElementById('radarInfo').innerText = `${radarCercano.tipo} (${radarCercano.velocidad} km/h)`;
          document.getElementById('radarDist').innerText = `${distMinima} m`;

          const ahora = Date.now();
          if (distMinima <= 500 && (ahora - ultimoAviso > 30000)) {
            log(`ALERTA: Radar a ${distMinima}m. Lanzando voz.`);
            hablar(`Atención, ${radarCercano.tipo} a ${radarCercano.velocidad} por hora a ${distMinima} metros`);
            ultimoAviso = ahora;
          }
        }
      }, err => {
        log(`ERROR GPS (${err.code}): ${err.message}`);
      }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      });
    } else {
      log("ERROR: Tu navegador no soporta Geolocation API");
    }
  });

  // Intentar cargar BDD al abrir la página
  cargarRadares();
</script>

</body>
</html>
