<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avisador Premium 3D</title>

    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* HUD Superior */
        .hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.95rem; padding: 8px; outline: none; }
        .search-btn, .clear-btn, .icon-btn {
            border: none; border-radius: 10px; padding: 0 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .search-btn { background: #00e5ff; color: #000; }
        .clear-btn { background: #ff3d00; color: #fff; display: none; }
        .icon-btn { background: rgba(255,255,255,0.1); color: #00e5ff; border: 1px solid rgba(0,229,255,0.3); }
        .icon-btn.active { background: #00e5ff; color: #000; }

        /* Menú de Configuración / Capas */
        .settings-panel {
            position: absolute;
            top: 70px;
            right: 12px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            width: 260px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .settings-panel.open { display: flex; }
        .settings-title { font-size: 0.9rem; font-weight: 800; color: #00e5ff; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .toggle-row input { accent-color: #00e5ff; width: 18px; height: 18px; cursor: pointer; }

        .hud-cards-row { display: flex; gap: 8px; }
        .hud-card {
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .speed-card { flex: 1; text-align: center; }
        .speed-val { font-size: 2rem; font-weight: 900; color: #00e5ff; line-height: 1; }
        .speed-unit { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }

        .radar-hud { flex: 2; border-left: 4px solid #ff3d00; display: flex; flex-direction: column; justify-content: center; }
        .radar-title { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
        .radar-info { font-size: 1rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .radar-dist-val { font-size: 1.3rem; font-weight: 900; color: #ff3d00; }

        /* HUD Inferior */
        .hud-bottom { position: absolute; bottom: 20px; left: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .btn-active { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
        .btn-inactive { background: linear-gradient(135deg, #d50000, #ff1744); color: #fff; }

        .recenter-btn {
            position: absolute; right: 12px; bottom: 140px; z-index: 10; background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.2); color: #00e5ff; width: 44px; height: 44px; border-radius: 50%;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .user-location-marker { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .user-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid #00e5ff; filter: drop-shadow(0 0 10px #00e5ff); }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>

        <div class="hud-top">
            <div class="search-box">
                <input type="text" id="destInput" class="search-input" placeholder="🔍 Buscar destino..." />
                <button id="searchBtn" class="search-btn">IR</button>
                <button id="voiceToggle" class="icon-btn active">🔊</button>
                <button id="settingsToggle" class="icon-btn">⚙️</button>
                <button id="clearRouteBtn" class="clear-btn">❌</button>
            </div>

            <!-- Panel de Configuración de Capas -->
            <div id="settingsPanel" class="settings-panel">
                <div class="settings-title">Capas de Alerta</div>
                <div class="toggle-row">
                    <span>🔴 Radares de Velocidad</span>
                    <input type="checkbox" id="layerSpeed" checked disabled />
                </div>
                <div class="toggle-row">
                    <span>🟨 Foto-Rojo (Semáforos)</span>
                    <input type="checkbox" id="layerTrafficSignals" />
                </div>
                <div class="toggle-row">
                    <span>📷 Cinturón / Móvil</span>
                    <input type="checkbox" id="layerBelt" />
                </div>
                <div class="toggle-row">
                    <span>🟣 Tramos de Riesgo</span>
                    <input type="checkbox" id="layerDanger" />
                </div>
            </div>

            <div class="hud-cards-row">
                <div class="hud-card speed-card">
                    <div class="speed-val" id="speedDisplay">0</div>
                    <div class="speed-unit">km/h</div>
                </div>
                <div class="hud-card radar-hud">
                    <div class="radar-title">Radar en ruta</div>
                    <div class="radar-info" id="radarType">Buscando...</div>
                    <div class="radar-dist-val" id="radarDist">-- m</div>
                </div>
            </div>
        </div>

        <button id="recenterBtn" class="recenter-btn">🎯</button>

        <div class="hud-bottom">
            <button id="toggleBtn" class="btn btn-inactive">INICIAR NAVEGACIÓN 3D</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let radares = [];
        let currentPos = { lat: 41.3871, lon: 2.1700 };

        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');

        // Controles de capa
        const layerTrafficSignals = document.getElementById('layerTrafficSignals');
        const layerBelt = document.getElementById('layerBelt');
        const layerDanger = document.getElementById('layerDanger');

        settingsToggle.addEventListener('click', () => {
            settingsPanel.classList.toggle('open');
            settingsToggle.classList.toggle('active');
        });

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [currentPos.lon, currentPos.lat],
                zoom: 14,
                pitch: 60,
                bearing: 0
            });

            map.on('load', () => {
                loadRadares();
            });
        }

        async function loadRadares() {
            try {
                const res = await fetch('radares.json');
                radares = await res.json();
                updateMapFilters();
            } catch (e) { console.error("Error cargando radares:", e); }
        }

        function updateMapFilters() {
            // Tipos permitidos por defecto: Solo velocidad
            const allowedTypes = ['RADAR_FIJO', 'RADAR_MOVIL', 'RADAR_TRAMO'];

            if (layerTrafficSignals.checked) allowedTypes.push('FOTO_ROJO');
            if (layerBelt.checked) allowedTypes.push('CAMARA_CINTURON');
            if (layerDanger.checked) allowedTypes.push('ZONA_RIESGO');

            const filteredGeoJSON = {
                type: 'FeatureCollection',
                features: radares
                    .filter(r => allowedTypes.includes(r.tipo))
                    .map(r => ({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [r.lon, r.lat] },
                        properties: { tipo: r.tipo, velocidad: r.velocidad }
                    }))
            };

            if (map.getSource('radares-src')) {
                map.getSource('radares-src').setData(filteredGeoJSON);
            } else {
                map.addSource('radares-src', { type: 'geojson', data: filteredGeoJSON });
                map.addLayer({
                    id: 'radares-layer',
                    type: 'circle',
                    source: 'radares-src',
                    paint: {
                        'circle-radius': 8,
                        'circle-color': [
                            'match', ['get', 'tipo'],
                            'RADAR_FIJO', '#ff1744',
                            'FOTO_ROJO', '#ffd600',
                            'CAMARA_CINTURON', '#00e5ff',
                            'ZONA_RIESGO', '#e040fb',
                            '#ff1744'
                        ],
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#ffffff'
                    }
                });
            }
        }

        [layerTrafficSignals, layerBelt, layerDanger].forEach(input => {
            input.addEventListener('change', updateMapFilters);
        });

        window.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
