<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avisador Premium 3D</title>

    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }

        .hud-top {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px;
        }

        .search-box {
            display: flex; gap: 6px; background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px); border-radius: 14px; padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.95rem; outline: none; }
        .search-btn, .icon-btn {
            border: none; border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .search-btn { background: #00e5ff; color: #000; }
        .icon-btn { background: rgba(255,255,255,0.1); color: #00e5ff; border: 1px solid rgba(0,229,255,0.3); }

        .settings-panel {
            position: absolute; top: 60px; right: 12px; z-index: 20;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
            border-radius: 16px; padding: 16px; border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 260px; display: none; flex-direction: column; gap: 12px;
        }
        .settings-panel.open { display: flex; }
        .settings-title { font-size: 0.85rem; font-weight: 800; color: #00e5ff; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .toggle-row input { accent-color: #00e5ff; width: 20px; height: 20px; cursor: pointer; }

        .hud-cards-row { display: flex; gap: 8px; }
        .hud-card {
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); border-radius: 14px; padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .speed-card { flex: 1; text-align: center; }
        .speed-val { font-size: 1.8rem; font-weight: 900; color: #00e5ff; line-height: 1; }
        .speed-unit { font-size: 0.65rem; color: #aaa; text-transform: uppercase; }

        .radar-hud { flex: 2; border-left: 4px solid #ff3d00; display: flex; flex-direction: column; justify-content: center; }
        .radar-title { font-size: 0.65rem; color: #aaa; text-transform: uppercase; }
        .radar-info { font-size: 0.9rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .radar-dist-val { font-size: 1.2rem; font-weight: 900; color: #ff3d00; }

        .hud-bottom { position: absolute; bottom: 24px; left: 12px; right: 12px; z-index: 10; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .btn-active { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
        .btn-inactive { background: linear-gradient(135deg, #d50000, #ff1744); color: #fff; }

        .recenter-btn {
            position: absolute; right: 12px; bottom: 95px; z-index: 10; background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.2); color: #00e5ff; width: 46px; height: 46px; border-radius: 50%;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .user-location-marker { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .user-arrow { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 22px solid #00e5ff; filter: drop-shadow(0 0 8px #00e5ff); transition: transform 0.2s ease; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>

        <div class="hud-top">
            <div class="search-box">
                <input type="text" id="destInput" class="search-input" placeholder="🔍 Buscar lugar o ciudad..." />
                <button id="searchBtn" class="search-btn">IR</button>
                <button id="settingsToggle" class="icon-btn">⚙️</button>
            </div>

            <div id="settingsPanel" class="settings-panel">
                <div class="settings-title">Filtro de Capas</div>
                <div class="toggle-row">
                    <span>🔴 Radares de Velocidad</span>
                    <input type="checkbox" id="layerSpeed" checked />
                </div>
                <div class="toggle-row">
                    <span>🟨 Foto-Rojo (Semáforos)</span>
                    <input type="checkbox" id="layerTrafficSignals" checked />
                </div>
                <div class="toggle-row">
                    <span>📷 Cinturón / Móvil</span>
                    <input type="checkbox" id="layerBelt" checked />
                </div>
            </div>

            <div class="hud-cards-row">
                <div class="hud-card speed-card">
                    <div class="speed-val" id="speedDisplay">0</div>
                    <div class="speed-unit">km/h</div>
                </div>
                <div class="hud-card radar-hud">
                    <div class="radar-title">Alerta Próxima</div>
                    <div class="radar-info" id="radarType">Sin Alertas</div>
                    <div class="radar-dist-val" id="radarDist">-- m</div>
                </div>
            </div>
        </div>

        <button id="recenterBtn" class="recenter-btn">🎯</button>

        <div class="hud-bottom">
            <button id="toggleBtn" class="btn btn-inactive">INICIAR NAVEGACIÓN 3D</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let radares = [];
        let userMarker;
        let watchId = null;
        let isNavigating = false;
        let currentPos = { lat: 41.3871, lon: 2.1700, heading: 0, speed: 0 };
        let hasInitialPosition = false;

        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');
        const toggleBtn = document.getElementById('toggleBtn');
        const recenterBtn = document.getElementById('recenterBtn');
        const searchBtn = document.getElementById('searchBtn');
        const destInput = document.getElementById('destInput');
        const speedDisplay = document.getElementById('speedDisplay');
        const radarType = document.getElementById('radarType');
        const radarDist = document.getElementById('radarDist');

        const layerSpeed = document.getElementById('layerSpeed');
        const layerTrafficSignals = document.getElementById('layerTrafficSignals');
        const layerBelt = document.getElementById('layerBelt');

        settingsToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('open');
        });

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [currentPos.lon, currentPos.lat],
                zoom: 13,
                pitch: 0
            });

            const el = document.createElement('div');
            el.className = 'user-location-marker';
            el.innerHTML = '<div class="user-arrow" id="userArrow"></div>';
            userMarker = new maplibregl.Marker({ element: el })
                .setLngLat([currentPos.lon, currentPos.lat])
                .addTo(map);

            map.on('load', () => {
                loadRadares();
                initRealGPS(); // Pedir ubicación real de inmediato
            });
        }

        // Obtener ubicación real del usuario desde el primer instante
        function initRealGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        hasInitialPosition = true;
                        updatePosition(lat, lon, 0, pos.coords.heading || 0);
                        map.flyTo({ center: [lon, lat], zoom: 15 });
                    },
                    (err) => console.warn("Permiso de ubicación denegado o no disponible:", err),
                    { enableHighAccuracy: true }
                );
            }
        }

        async function loadRadares() {
            try {
                const res = await fetch('radares.json?v=' + new Date().getTime());
                radares = await res.json();
                updateMapFilters();
            } catch (e) {
                console.error("Error al cargar radares.json:", e);
            }
        }

        function updateMapFilters() {
            if (!radares || !radares.length) return;

            const showSpeed = layerSpeed.checked;
            const showTraffic = layerTrafficSignals.checked;
            const showBelt = layerBelt.checked;

            const features = radares.filter(r => {
                const t = String(r.tipo || '').toUpperCase();
                if (t.includes('ROJO') || t.includes('SEMAFORO') || t.includes('TRAFFIC_SIGNALS')) {
                    return showTraffic;
                }
                if (t.includes('CINTURON') || t.includes('MOVIL') || t.includes('BELT') || t.includes('PHONE')) {
                    return showBelt;
                }
                return showSpeed;
            }).map(r => ({
                type: 'Feature',
                geometry: { 
                    type: 'Point', 
                    coordinates: [parseFloat(r.lon), parseFloat(r.lat)] 
                },
                properties: { 
                    tipo: r.tipo || 'RADAR_FIJO', 
                    vel: r.velocidad || 80 
                }
            }));

            const geojson = { type: 'FeatureCollection', features };

            if (map.getSource('radares-src')) {
                map.getSource('radares-src').setData(geojson);
            } else {
                map.addSource('radares-src', { type: 'geojson', data: geojson });
                map.addLayer({
                    id: 'radares-layer',
                    type: 'circle',
                    source: 'radares-src',
                    paint: {
                        'circle-radius': 6,
                        'circle-color': [
                            'match', ['get', 'tipo'],
                            'FOTO_ROJO', '#ffea00',
                            'CAMARA_CINTURON', '#e040fb',
                            '#ff1744'
                        ],
                        'circle-stroke-width': 1,
                        'circle-stroke-color': '#ffffff'
                    }
                });
            }
        }

        function updatePosition(lat, lon, speed = 0, heading = 0) {
            currentPos = { lat, lon, speed, heading };
            userMarker.setLngLat([lon, lat]);
            
            const arrow = document.getElementById('userArrow');
            if (arrow) arrow.style.transform = `rotate(${heading}deg)`;

            speedDisplay.innerText = Math.round(speed);
            checkProximity(lat, lon);

            if (isNavigating) {
                map.easeTo({
                    center: [lon, lat],
                    bearing: heading,
                    pitch: 60,
                    zoom: 16.5,
                    duration: 800
                });
            }
        }

        function checkProximity(lat, lon) {
            if (!radares.length) return;
            let minDist = Infinity;
            let closest = null;

            for (let i = 0; i < radares.length; i++) {
                const r = radares[i];
                const d = getDistanceMeters(lat, lon, parseFloat(r.lat), parseFloat(r.lon));
                if (d < minDist) {
                    minDist = d;
                    closest = r;
                }
            }

            if (closest && minDist < 1200) {
                radarType.innerText = `${closest.tipo.replace('_', ' ')} (${closest.velocidad || 80} km/h)`;
                radarDist.innerText = `${Math.round(minDist)} m`;
            } else {
                radarType.innerText = "Sin Alertas";
                radarDist.innerText = "-- m";
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        searchBtn.addEventListener('click', async () => {
            const query = destInput.value;
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const top = data[0];
                    map.flyTo({ center: [parseFloat(top.lon), parseFloat(top.lat)], zoom: 14 });
                } else {
                    alert("Destino no encontrado");
                }
            } catch (e) { console.error(e); }
        });

        // Activar/Desactivar Rastreo GPS Real
        toggleBtn.addEventListener('click', () => {
            isNavigating = !isNavigating;

            if (isNavigating) {
                toggleBtn.innerText = "DETENER NAVEGACIÓN";
                toggleBtn.className = "btn btn-active";

                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            const spd = (pos.coords.speed || 0) * 3.6; // m/s a km/h
                            const hdg = pos.coords.heading || 0;
                            updatePosition(pos.coords.latitude, pos.coords.longitude, spd, hdg);
                        },
                        (err) => {
                            alert("Error GPS: Asegúrate de dar permisos de Ubicación en el navegador.");
                            console.error(err);
                        },
                        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                    );
                } else {
                    alert("Tu navegador no soporta geolocalización.");
                }

            } else {
                toggleBtn.innerText = "INICIAR NAVEGACIÓN 3D";
                toggleBtn.className = "btn btn-inactive";
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                speedDisplay.innerText = "0";
                map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
            }
        });

        recenterBtn.addEventListener('click', () => {
            map.flyTo({ center: [currentPos.lon, currentPos.lat], zoom: 16, pitch: isNavigating ? 60 : 0 });
        });

        [layerSpeed, layerTrafficSignals, layerBelt].forEach(el => el.addEventListener('change', updateMapFilters));

        window.addEventListener('load', initMap);
    </script>
</body>
</html>
