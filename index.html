<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avisador 3D - Waze Killer</title>

    <!-- CSS MapLibre GL JS (Mapa Vectorial 3D) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Contenedor del Mapa 3D ocupa toda la pantalla */
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* HUD Superior (Velocidad y Alerta de Radar) */
        .hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .hud-card {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .speed-card { flex: 1; text-align: center; }
        .speed-val { font-size: 2.2rem; font-weight: 900; color: #00e5ff; line-height: 1; }
        .speed-unit { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 2px; }

        .radar-hud { flex: 2; border-left: 4px solid #ff3d00; display: flex; flex-direction: column; justify-content: center; }
        .radar-title { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
        .radar-info { font-size: 1.1rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .radar-dist-val { font-size: 1.4rem; font-weight: 900; color: #ff3d00; }

        /* Controles Inferiores */
        .hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }
        .btn-active { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
        .btn-inactive { background: linear-gradient(135deg, #d50000, #ff1744); color: #fff; }

        /* Consola de Logs desplegable/pequeña */
        .logs-card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #00ff66;
            max-height: 60px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Marcador de Vehículo 3D / Flecha estilo Waze */
        .user-location-marker {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, rgba(0,229,255,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 24px solid #00e5ff;
            filter: drop-shadow(0 0 8px #00e5ff);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <!-- Mapa Vectorial 3D -->
        <div id="map"></div>

        <!-- HUD Superior -->
        <div class="hud-top">
            <div class="hud-card speed-card">
                <div class="speed-val" id="speedDisplay">0</div>
                <div class="speed-unit">km/h</div>
            </div>
            <div class="hud-card radar-hud">
                <div class="radar-title">Radar en ruta</div>
                <div class="radar-info" id="radarType">Buscando...</div>
                <div class="radar-dist-val" id="radarDist">-- m</div>
            </div>
        </div>

        <!-- HUD Inferior -->
        <div class="hud-bottom">
            <div class="logs-card" id="logs">Iniciando motor 3D MapLibre...\n</div>
            <button id="toggleBtn" class="btn btn-inactive">INICIAR MODO NAVEGACIÓN 3D</button>
        </div>
    </div>

    <!-- Script de MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let isRunning = false;
        let watchId = null;
        let radares = [];
        let wakeLock = null;
        let lastPosition = null;
        let currentHeading = 0;
        let userMarkerElement, userMarker;

        const speedDisplay = document.getElementById('speedDisplay');
        const radarType = document.getElementById('radarType');
        const radarDist = document.getElementById('radarDist');
        const toggleBtn = document.getElementById('toggleBtn');

        function log(msg) {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logs.innerHTML += `[${time}] ${msg}\n`;
            logs.scrollTop = logs.scrollHeight;
        }

        // --- 1. Inicializar Mapa 3D Vectorial ---
        function init3DMap() {
            // Estilo Vectorial Oscuro Gratuito (CartoDB Dark Matter Vector)
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [2.1734, 41.3851], // [Lon, Lat] -> Barcelona por defecto
                zoom: 16,
                pitch: 60, // Inclinación 3D estilo Waze (60 grados)
                bearing: 0, // Rotación según dirección del coche
                antialias: true
            });

            // Crear marcador de vehículo tipo flecha 3D
            userMarkerElement = document.createElement('div');
            userMarkerElement.className = 'user-location-marker';
            userMarkerElement.innerHTML = '<div class="user-arrow" id="userArrow"></div>';
            
            userMarker = new maplibregl.Marker({ element: userMarkerElement })
                .setLngLat([2.1734, 41.3851])
                .addTo(map);

            map.on('load', () => {
                log("🗺️ Mapa 3D cargado correctamente.");
                loadRadares();
            });
        }

        // --- 2. Cargar Radares en Capa Vectorial de MapLibre ---
        async function loadRadares() {
            try {
                log("Cargando radares.json...");
                const res = await fetch('radares.json');
                radares = await res.json();
                log(`¡ÉXITO! ${radares.length} radares listos.`);

                // Convertir array de radares a GeoJSON para MapLibre
                const geojsonRadares = {
                    type: 'FeatureCollection',
                    features: radares.map(r => ({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [r.lon, r.lat] },
                        properties: { tipo: r.tipo, velocidad: r.velocidad }
                    }))
                };

                // Añadir la fuente de datos al mapa
                map.addSource('radares-src', {
                    type: 'geojson',
                    data: geojsonRadares
                });

                // Renderizar radares como círculos 3D brillantes en el mapa
                map.addLayer({
                    id: 'radares-layer',
                    type: 'circle',
                    source: 'radares-src',
                    paint: {
                        'circle-radius': 6,
                        'circle-color': '#ff3d00',
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#ffffff',
                        'circle-opacity': 0.9
                    }
                });

            } catch (e) {
                log("⚠️ Error cargando radares: " + e.message);
            }
        }

        // --- 3. Wake Lock ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log("💡 Pantalla bloqueada para permanecer encendida.");
                }
            } catch (err) {
                log(`⚠️ Wake Lock error: ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // --- 4. Matemáticas de Distancia y Rumbo (Bearing) ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // --- 5. Tracking GPS & Cámara 3D ---
        function handlePosition(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const speedKmH = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            
            speedDisplay.innerText = speedKmH;

            // Si el GPS nos da dirección o la calculamos por movimiento
            if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
                currentHeading = pos.coords.heading;
            } else if (lastPosition) {
                const distMoved = getDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                if (distMoved > 2) {
                    currentHeading = calculateBearing(lastPosition.lat, lastPosition.lon, lat, lon);
                }
            }
            lastPosition = { lat, lon };

            // 1. Mover el marcador del vehículo
            userMarker.setLngLat([lon, lat]);

            // 2. Transición suave de cámara 3D siguiendo al coche y orientando el mapa
            map.easeTo({
                center: [lon, lat],
                bearing: currentHeading, // El mapa gira automáticamente según tu marcha
                pitch: 60,               // Mantiene la inclinación 3D
                duration: 1000,
                easing: (t) => t
            });

            // 3. Buscar el radar más cercano en tu rumbo
            if (radares.length > 0) {
                let minDist = Infinity;
                let closestRadar = null;

                radares.forEach(r => {
                    const d = getDistance(lat, lon, r.lat, r.lon);
                    
                    // Comprobar que el radar esté enfrente (±60°)
                    const bearingToRadar = calculateBearing(lat, lon, r.lat, r.lon);
                    const diff = Math.abs(currentHeading - bearingToRadar);
                    const angle = diff > 180 ? 360 - diff : diff;

                    if (angle <= 60 && d < minDist) {
                        minDist = d;
                        closestRadar = r;
                    }
                });

                if (closestRadar) {
                    radarType.innerText = `${closestRadar.tipo} (${closestRadar.velocidad} km/h)`;
                    radarDist.innerText = `${Math.round(minDist)} m`;
                }
            }
        }

        // --- Toggle Activar / Desactivar ---
        toggleBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                toggleBtn.innerText = "DETENER NAVEGACIÓN";
                toggleBtn.className = "btn btn-active";
                requestWakeLock();
                
                log("Rastreando posición GPS en modo 3D...");
                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    (err) => log(`⚠️ Error GPS: ${err.message}`),
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            } else {
                isRunning = false;
                toggleBtn.innerText = "INICIAR MODO NAVEGACIÓN 3D";
                toggleBtn.className = "btn btn-inactive";
                releaseWakeLock();
                if (watchId) navigator.geolocation.clearWatch(watchId);
                log("Navegación detenida.");
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            init3DMap();
        });
    </script>
</body>
</html>
