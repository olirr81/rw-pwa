<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avisador Waze Style Premium</title>

    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }

        .hud-top {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .hud-cards-row { display: flex; gap: 8px; pointer-events: auto; }
        .hud-card {
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(12px); border-radius: 16px; padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .speed-card { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .speed-val { font-size: 2rem; font-weight: 900; color: #00e5ff; line-height: 1; }
        .speed-unit { font-size: 0.65rem; color: #aaa; text-transform: uppercase; margin-top: 2px; }

        .radar-hud { flex: 2.5; border-left: 4px solid #ff3d00; display: flex; flex-direction: column; justify-content: center; }
        .radar-title { font-size: 0.65rem; color: #aaa; text-transform: uppercase; }
        .radar-info { font-size: 0.85rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .radar-dist-val { font-size: 1.1rem; font-weight: 900; color: #ff3d00; }

        .search-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(20px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 20px 16px 34px 16px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .sheet-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 0 auto 16px auto; }
        
        .waze-search-bar {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.1); gap: 10px;
        }
        .waze-search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; }
        
        .search-results-list {
            max-height: 220px; overflow-y: auto; margin-top: 10px; display: none; flex-direction: column; gap: 6px;
        }
        .search-result-item {
            padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 0.9rem; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
        }
        .search-result-item:hover { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.3); }

        .route-preview-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 25;
            background: rgba(18, 24, 38, 0.98); backdrop-filter: blur(20px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px 20px 36px 20px; border-top: 2px solid #00e5ff;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9); display: none; flex-direction: column; gap: 14px;
        }
        .route-info-row { display: flex; justify-content: space-between; align-items: center; }
        .route-title { font-size: 1.1rem; font-weight: 800; color: #fff; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .route-metrics { font-size: 0.95rem; font-weight: 700; color: #00e5ff; }
        .route-radares-tag {
            background: rgba(255, 61, 0, 0.2); border: 1px solid rgba(255, 61, 0, 0.5);
            padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; color: #ff6e40;
            display: flex; align-items: center; gap: 8px;
        }
        .route-buttons { display: flex; gap: 12px; margin-top: 4px; }
        .btn-cancel-route { flex: 1; background: rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; }
        .btn-go-route { flex: 2; background: linear-gradient(135deg, #00c853, #00e676); color: #000; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,200,83,0.4); }

        .active-nav-sheet {
            position: absolute; bottom: 24px; left: 16px; right: 16px; z-index: 20; display: none;
        }
        .btn-stop { width: 100%; background: linear-gradient(135deg, #d50000, #ff1744); color: #fff; padding: 16px; border-radius: 16px; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 8px 30px rgba(213,0,0,0.5); }

        .recenter-btn {
            position: absolute; right: 16px; bottom: 130px; z-index: 15; background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.2); color: #00e5ff; width: 48px; height: 48px; border-radius: 50%;
            font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .user-location-marker { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .user-arrow { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 22px solid #00e5ff; filter: drop-shadow(0 0 8px #00e5ff); transition: transform 0.3s ease-out; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>

        <div class="hud-top">
            <div class="hud-cards-row">
                <div class="hud-card speed-card">
                    <div class="speed-val" id="speedDisplay">0</div>
                    <div class="speed-unit">km/h</div>
                </div>
                <div class="hud-card radar-hud">
                    <div class="radar-title">Alerta Próxima</div>
                    <div class="radar-info" id="radarType">Sin Alertas</div>
                    <div class="radar-dist-val" id="radarDist">-- m</div>
                </div>
            </div>
        </div>

        <button id="recenterBtn" class="recenter-btn">🎯</button>

        <div id="searchSheet" class="search-sheet">
            <div class="sheet-handle"></div>
            <div class="waze-search-bar">
                <span>🔍</span>
                <input type="text" id="destInput" class="waze-search-input" placeholder="¿A dónde vas?" />
            </div>
            <div id="searchResults" class="search-results-list"></div>
        </div>

        <div id="routePreviewSheet" class="route-preview-sheet">
            <div class="route-info-row">
                <div class="route-title" id="previewTitle">Destino</div>
                <div class="route-metrics" id="previewMetrics">-- min • -- km</div>
            </div>
            <div class="route-radares-tag" id="routeRadaresTag">
                <span>📷</span> <span id="routeRadaresCount">Calculando radares...</span>
            </div>
            <div class="route-buttons">
                <button class="btn-cancel-route" id="cancelPreviewBtn">Cancelar</button>
                <button class="btn-go-route" id="goRouteBtn">¡Conducir!</button>
            </div>
        </div>

        <div id="activeNavSheet" class="active-nav-sheet">
            <button class="btn-stop" id="stopNavBtn">DETENER NAVEGACIÓN</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script>
        let map;
        let radares = [];
        let userMarker;
        let watchId = null;
        let isNavigating = false;
        let userTracking = true;
        let currentPos = { lat: 41.3871, lon: 2.1700, heading: 0, speed: 0 };
        let selectedDestination = null;
        let detectedRadaresCount = 0;
        let spanishVoice = null;

        const destInput = document.getElementById('destInput');
        const searchResults = document.getElementById('searchResults');
        const searchSheet = document.getElementById('searchSheet');
        const routePreviewSheet = document.getElementById('routePreviewSheet');
        const activeNavSheet = document.getElementById('activeNavSheet');
        
        const previewTitle = document.getElementById('previewTitle');
        const previewMetrics = document.getElementById('previewMetrics');
        const routeRadaresCount = document.getElementById('routeRadaresCount');
        const goRouteBtn = document.getElementById('goRouteBtn');
        const cancelPreviewBtn = document.getElementById('cancelPreviewBtn');
        const stopNavBtn = document.getElementById('stopNavBtn');
        
        const speedDisplay = document.getElementById('speedDisplay');
        const radarType = document.getElementById('radarType');
        const radarDist = document.getElementById('radarDist');
        const recenterBtn = document.getElementById('recenterBtn');

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            spanishVoice = voices.find(v => v.lang === 'es-ES' || v.lang === 'es_ES') || 
                           voices.find(v => v.lang.startsWith('es')) || 
                           voices[0];
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                if (spanishVoice) utterance.voice = spanishVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [currentPos.lon, currentPos.lat],
                zoom: 14,
                pitch: 0
            });

            const el = document.createElement('div');
            el.className = 'user-location-marker';
            el.innerHTML = '<div class="user-arrow" id="userArrow"></div>';
            userMarker = new maplibregl.Marker({ element: el })
                .setLngLat([currentPos.lon, currentPos.lat])
                .addTo(map);

            map.on('dragstart', () => { userTracking = false; });

            map.on('load', async () => {
                await loadRadaresData();
                addRadaresLayerToMap([]);
                initRealGPS();
            });
        }

        function initRealGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        updatePosition(pos.coords.latitude, pos.coords.longitude, 0, pos.coords.heading || 0, true);
                        map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 15 });
                    },
                    (err) => console.warn("GPS pendiente:", err),
                    { enableHighAccuracy: true }
                );
            }
        }

        async function loadRadaresData() {
            try {
                const res = await fetch('radares.json?v=' + new Date().getTime());
                radares = await res.json();
                console.log("Radares cargados con éxito:", radares.length);
            } catch (e) {
                console.error("Error al cargar radares.json:", e);
                radares = [];
            }
        }

        function addRadaresLayerToMap(routeRadaresIds = []) {
            if (!radares.length) return;
            const features = radares.map((r, index) => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [parseFloat(r.lon), parseFloat(r.lat)] },
                properties: { 
                    tipo: r.tipo || 'RADAR_FIJO', 
                    vel: r.velocidad || 80,
                    isOnRoute: routeRadaresIds.includes(index) ? 1 : 0
                }
            }));

            if (map.getSource('radares-src')) {
                map.getSource('radares-src').setData({ type: 'FeatureCollection', features });
            } else {
                map.addSource('radares-src', { type: 'geojson', data: { type: 'FeatureCollection', features } });
                
                // Usamos capa de tipo 'circle' altamente optimizada: nunca fallan al renderizar
                map.addLayer({
                    id: 'radares-layer',
                    type: 'circle',
                    source: 'radares-src',
                    paint: {
                        // Tamaño dinámico según zoom y si pertenecen a la ruta
                        'circle-radius': [
                            'case',
                            ['==', ['get', 'isOnRoute'], 1],
                            // Si están en la ruta: grandes y muy visibles
                            ['interpolate', ['linear'], ['zoom'], 6, 4, 12, 7, 16, 12],
                            // Resto de radares: pequeños de lejos, grandes de cerca
                            ['interpolate', ['linear'], ['zoom'], 5, 1.5, 10, 3, 14, 6, 17, 9]
                        ],
                        // Color naranja/rojo brillante Waze style con borde blanco para contraste
                        'circle-color': [
                            'case',
                            ['==', ['get', 'isOnRoute'], 1],
                            '#ff3d00', // Naranja intenso ruta
                            '#ff6e40'  // Naranja normal mapa
                        ],
                        'circle-stroke-width': [
                            'case',
                            ['==', ['get', 'isOnRoute'], 1],
                            2.5,
                            1
                        ],
                        'circle-stroke-color': '#ffffff',
                        'circle-opacity': 0.95
                    }
                });
            }
        }

        destInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 3) {
                searchResults.style.display = 'none';
                return;
            }
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                searchResults.innerHTML = '';
                if (data.length > 0) {
                    searchResults.style.display = 'flex';
                    data.slice(0, 5).forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerText = place.display_name;
                        div.onclick = () => selectDestination(place);
                        searchResults.appendChild(div);
                    });
                }
            } catch (err) { console.error(err); }
        });

        async function selectDestination(place) {
            destInput.blur();
            searchResults.style.display = 'none';
            searchSheet.style.display = 'none';
            
            selectedDestination = {
                name: place.display_name.split(',')[0],
                lat: parseFloat(place.lat),
                lon: parseFloat(place.lon)
            };

            previewTitle.innerText = selectedDestination.name;
            previewMetrics.innerText = "Calculando ruta...";
            routeRadaresCount.innerText = "Analizando radares en el camino...";
            routePreviewSheet.style.display = 'flex';

            map.flyTo({ center: [selectedDestination.lon, selectedDestination.lat], zoom: 8, pitch: 0 });

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${currentPos.lon},${currentPos.lat};${selectedDestination.lon},${selectedDestination.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const km = (route.distance / 1000).toFixed(1);
                    const mins = Math.round(route.duration / 60);
                    previewMetrics.innerText = `${mins} min • ${km} km`;

                    drawRouteLine(route.geometry);
                    markRadaresOnRoute(route.geometry.coordinates);
                }
            } catch (e) {
                previewMetrics.innerText = "Ruta directa";
                routeRadaresCount.innerText = "Sin datos de radares";
            }
        }

        function markRadaresOnRoute(coords) {
            if (!radares || !radares.length) {
                detectedRadaresCount = 0;
                routeRadaresCount.innerText = "0 radares detectados en la ruta";
                return;
            }

            const routeRadaresIndices = [];
            detectedRadaresCount = 0;

            radares.forEach((r, index) => {
                const rLat = parseFloat(r.lat);
                const rLon = parseFloat(r.lon);
                for (let i = 0; i < coords.length; i += Math.max(1, Math.floor(coords.length / 250))) {
                    if (getDistanceMeters(coords[i][1], coords[i][0], rLat, rLon) < 300) {
                        detectedRadaresCount++;
                        routeRadaresIndices.push(index);
                        break;
                    }
                }
            });

            addRadaresLayerToMap(routeRadaresIndices);

            if (detectedRadaresCount > 0) {
                routeRadaresCount.innerText = `${detectedRadaresCount} radares detectados en tu camino`;
            } else {
                routeRadaresCount.innerText = "¡Camino limpio! 0 radares en la ruta";
            }
        }

        function drawRouteLine(geojsonGeom) {
            if (map.getSource('route-src')) {
                map.getSource('route-src').setData({ type: 'Feature', geometry: geojsonGeom });
            } else {
                map.addSource('route-src', { type: 'geojson', data: { type: 'Feature', geometry: geojsonGeom } });
                map.addLayer({
                    id: 'route-layer',
                    type: 'line',
                    source: 'route-src',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#00e5ff', 'line-width': 6, 'line-opacity': 0.85 }
                }, 'radares-layer');
            }
        }

        goRouteBtn.addEventListener('click', () => {
            routePreviewSheet.style.display = 'none';
            activeNavSheet.style.display = 'block';
            isNavigating = true;
            userTracking = true;

            speak(`Iniciando ruta hacia ${selectedDestination.name}. Se han detectado ${detectedRadaresCount} radares en tu camino. Conduce con precaución.`);

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const spd = (pos.coords.speed || 0) * 3.6;
                        updatePosition(pos.coords.latitude, pos.coords.longitude, spd, pos.coords.heading || 0);
                    },
                    (err) => console.error(err),
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
            }
        });

        cancelPreviewBtn.addEventListener('click', () => {
            routePreviewSheet.style.display = 'none';
            searchSheet.style.display = 'block';
            destInput.value = '';
            if (map.getSource('route-src')) map.removeLayer('route-layer'), map.removeSource('route-src');
            addRadaresLayerToMap([]);
            map.flyTo({ center: [currentPos.lon, currentPos.lat], zoom: 15 });
        });

        stopNavBtn.addEventListener('click', () => {
            isNavigating = false;
            activeNavSheet.style.display = 'none';
            searchSheet.style.display = 'block';
            destInput.value = '';
            speak("Navegación finalizada.");
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (map.getSource('route-src')) map.removeLayer('route-layer'), map.removeSource('route-src');
            addRadaresLayerToMap([]);
            map.easeTo({ pitch: 0, bearing: 0, duration: 800 });
        });

        function updatePosition(lat, lon, speed = 0, heading = 0, force = false) {
            currentPos = { lat, lon, speed, heading };
            userMarker.setLngLat([lon, lat]);
            document.getElementById('userArrow').style.transform = `rotate(${heading}deg)`;
            speedDisplay.innerText = Math.round(speed);
            checkProximity(lat, lon);

            if (isNavigating && (userTracking || force)) {
                map.easeTo({
                    center: [lon, lat],
                    bearing: heading,
                    pitch: 60,
                    zoom: 16.5,
                    duration: 500,
                    easing: t => t
                });
            }
        }

        let lastAlertedRadar = null;
        function checkProximity(lat, lon) {
            if (!radares.length) return;
            let minDist = Infinity;
            let closest = null;

            for (let i = 0; i < radares.length; i++) {
                const r = radares[i];
                const d = getDistanceMeters(lat, lon, parseFloat(r.lat), parseFloat(r.lon));
                if (d < minDist) {
                    minDist = d;
                    closest = r;
                }
            }

            if (closest && minDist < 1500) {
                const rName = (closest.tipo || 'RADAR').replace('_', ' ');
                radarType.innerText = `${rName} (${closest.velocidad || 80} km/h)`;
                radarDist.innerText = `${Math.round(minDist)} m`;

                if (minDist <= 500 && lastAlertedRadar !== closest) {
                    lastAlertedRadar = closest;
                    speak(`Atención, radar a quinientos metros. Límite de ${closest.velocidad || 80} kilómetros por hora.`);
                }
            } else {
                radarType.innerText = "Sin Alertas";
                radarDist.innerText = "-- m";
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        recenterBtn.addEventListener('click', () => {
            userTracking = true;
            map.flyTo({ center: [currentPos.lon, currentPos.lat], zoom: 16, pitch: isNavigating ? 60 : 0, bearing: currentPos.heading });
        });

        window.addEventListener('load', initMap);
    </script>
</body>
</html>
